# Publishes the Campfire website (web/) to GitHub Pages:
#   https://shamanshade.github.io/CampFire_Client/
# One-time setup on GitHub: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Website

on:
  push:
    branches: [main]
    paths: ["web/**", "decorations/**", "tools/build_site.py", "icon.png", "avatar.png", "icon.ico", "campfire_config.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Build the site
        run: python3 tools/build_site.py _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          name: github-pages
          retention-days: 1
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
