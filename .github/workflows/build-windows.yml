# Builds the Windows downloads on every push to main, checks they work, and publishes them on the
# repo's Releases page as "Campfire for Windows (latest)". Run it by hand from the Actions tab too.
#   Campfire-Setup.exe   installer for the chat app (Start menu, desktop shortcut, uninstaller)
#   Campfire-Windows.zip both programs (Campfire.exe and Campfire Server.exe), no install
# The old "admin-build" pre-release now carries the same Campfire-Setup.exe (named
# Campfire-Admin-Setup.exe), so old Campfire Admin apps update themselves into Campfire.
name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Version number
        shell: bash
        run: echo 'VERSION = "1.0.${{ github.run_number }}"' > _version.py

      - name: Build
        run: pyinstaller --noconfirm campfire.spec

      - name: Check the client has everything (voice, video, emoji, icons...)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/Campfire/Campfire.exe" -ArgumentList "--selftest","selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "Campfire.exe self-test failed" }

      - name: Check the server starts and answers
        shell: pwsh
        run: |
          $s = Start-Process -FilePath "dist/Campfire/Campfire Server.exe" -ArgumentList "--nogui","--port","55990" -PassThru
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 1
            try { $c = New-Object Net.Sockets.TcpClient("127.0.0.1", 55990); $ok = $true; $c.Close(); break } catch {}
          }
          Stop-Process -Id $s.Id -Force
          if (-not $ok) { throw "Campfire Server.exe didn't start listening" }
          Remove-Item -Recurse -Force "dist/Campfire/campfire.db*", "dist/Campfire/campfire_files" -ErrorAction SilentlyContinue

      - name: Check the server can update itself (swap files, keep data, start again)
        shell: pwsh
        run: |
          $old = "$env:TEMP\old-server\Campfire"
          New-Item -ItemType Directory -Force $old | Out-Null
          Copy-Item -Recurse "dist/Campfire/*" $old
          Set-Content "$old\campfire.db" "PRETEND ACCOUNTS"
          Set-Content "$old\_internal\stale.txt" "from the old version"
          $staged = "$env:TEMP\staged\Campfire"
          New-Item -ItemType Directory -Force $staged | Out-Null
          Copy-Item -Recurse "dist/Campfire/*" $staged
          $relaunch = '["--nogui","--port","55991","--db","' + ($old -replace '\\','\\') + '\\real.db"]'
          $f = Start-Process -FilePath "$staged\Campfire Server.exe" -ArgumentList "--finish-update","`"$old`"","--wait-pid","0","--relaunch-args",($relaunch -replace '"','\"') -PassThru
          $null = $f.Handle     # keeps the exit code readable
          $f.WaitForExit()      # just this process (-Wait would also wait for the server it starts)
          Get-Content "$old\campfire_update.log"
          if ($f.ExitCode -ne 0) { throw "the update step failed" }
          if ((Get-Content "$old\campfire.db") -ne "PRETEND ACCOUNTS") { throw "the update touched campfire.db" }
          if (Test-Path "$old\_internal\stale.txt") { throw "old libraries were left behind" }
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 1
            try { $c = New-Object Net.Sockets.TcpClient("127.0.0.1", 55991); $ok = $true; $c.Close(); break } catch {}
          }
          Get-Process "Campfire Server" -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $ok) { throw "the updated server didn't start again" }
          Write-Host "Server self-update OK"

      - name: Zip
        shell: pwsh
        run: |
          Copy-Item README.md dist/Campfire/README.md
          Compress-Archive -Path dist/Campfire -DestinationPath Campfire-Windows.zip

      - name: Build the installer (Campfire-Setup.exe)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DMyAppVersion=1.0.${{ github.run_number }}" installer\campfire.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Check the installer installs, runs and uninstalls
        shell: pwsh
        run: |
          $p = Start-Process "dist\Campfire-Setup.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/TASKS=desktopicon" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Setup failed with exit code $($p.ExitCode)" }
          $app = "$env:LOCALAPPDATA\Programs\Campfire"
          if (-not (Test-Path "$app\Campfire.exe")) { throw "Campfire.exe wasn't installed in $app" }
          if (Test-Path "$app\Campfire Server.exe") { throw "the client installer shouldn't include the server" }
          $s = Start-Process "$app\Campfire.exe" -ArgumentList "--selftest","$env:TEMP\installed-selftest.txt" -Wait -PassThru
          Get-Content "$env:TEMP\installed-selftest.txt"
          if ($s.ExitCode -ne 0) { throw "the installed Campfire failed its self-test" }
          if (-not (Select-String -Path "$env:TEMP\installed-selftest.txt" -Pattern "ok   version 1\.0\.${{ github.run_number }}" -Quiet)) { throw "the installed app has the wrong version number" }
          $menu = Join-Path ([Environment]::GetFolderPath("Programs")) "Campfire.lnk"
          $desk = Join-Path ([Environment]::GetFolderPath("Desktop")) "Campfire.lnk"
          if (-not (Test-Path $menu)) { throw "no Start menu shortcut at $menu" }
          if (-not (Test-Path $desk)) { throw "no desktop shortcut at $desk" }
          $u = Start-Process "$app\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          Start-Sleep -Seconds 3
          if ((Test-Path "$app\Campfire.exe") -or (Test-Path $menu)) { throw "uninstall left Campfire behind" }
          Write-Host "Installer OK: installs, runs, makes shortcuts, uninstalls cleanly"

      - name: Check an old Campfire Admin gets replaced
        # installs the last real Campfire Admin (if the admin-build release still has it), then
        # Campfire-Setup.exe, which should remove it
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download admin-build -p Campfire-Admin-Setup.exe -D old-admin
          if (-not (Test-Path "old-admin\Campfire-Admin-Setup.exe")) { Write-Host "No old admin build to test"; exit 0 }
          Start-Process "old-admin\Campfire-Admin-Setup.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER" -Wait | Out-Null
          $old = "$env:LOCALAPPDATA\Programs\Campfire Admin\Campfire Admin.exe"
          if (-not (Test-Path $old)) { Write-Host "admin-build already holds the normal installer - nothing to test"; exit 0 }
          Start-Process "dist\Campfire-Setup.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER" -Wait | Out-Null
          Start-Sleep -Seconds 5
          if (Test-Path $old) { throw "installing Campfire didn't remove the old Campfire Admin" }
          $menu = Join-Path ([Environment]::GetFolderPath("Programs")) "Campfire Admin.lnk"
          if (Test-Path $menu) { throw "the old Campfire Admin Start menu shortcut is still there" }
          $app = "$env:LOCALAPPDATA\Programs\Campfire"
          if (-not (Test-Path "$app\Campfire.exe")) { throw "Campfire wasn't installed" }
          Start-Process "$app\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait | Out-Null
          Write-Host "Old Campfire Admin was replaced by Campfire"

      - uses: actions/upload-artifact@v4
        with:
          name: Campfire-Windows
          path: |
            Campfire-Windows.zip
            dist/Campfire-Setup.exe

      - name: Keep old Campfire Admin apps updating (into Campfire)
        # published before "latest" so an old admin app that sees the new version.json can already
        # download it. Campfire-Setup.exe removes Campfire Admin when it installs.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.draft and .name == "Campfire Admin (private)") | .id'); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          cp dist/Campfire-Setup.exe Campfire-Admin-Setup.exe
          gh release delete admin-build --cleanup-tag --yes || true
          gh release create admin-build Campfire-Admin-Setup.exe --target "$GITHUB_SHA" \
            --prerelease --latest=false --title "Admin build (retired)" \
            --notes "Campfire Admin is now part of Campfire: the normal app finds a server on the same PC by itself. This file is the normal Campfire installer, kept here so old Campfire Admin apps update into Campfire (it removes Campfire Admin). Version 1.0.${{ github.run_number }}."

      - name: Publish on the Releases page
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          printf '{"version": "1.0.%s", "setup": "Campfire-Setup.exe", "admin_setup": "Campfire-Admin-Setup.exe", "commit": "%s"}\n' "${{ github.run_number }}" "$GITHUB_SHA" > version.json   # admin_setup: for old Campfire Admin apps
          gh release create latest dist/Campfire-Setup.exe Campfire-Windows.zip version.json --target "$GITHUB_SHA" \
            --title "Campfire for Windows (latest)" --latest \
            --notes "**Campfire-Setup.exe** - installs the chat app (Start menu, optional desktop shortcut, uninstall from Windows Settings). No admin rights or Python needed. Running a newer setup file updates Campfire.

          **Campfire-Windows.zip** - both programs, no install: unzip and double-click **Campfire.exe**, or **Campfire Server.exe** on the PC that hosts the server. Campfire connects to a server on the same PC by itself.

          Version 1.0.${{ github.run_number }}, built automatically from commit ${GITHUB_SHA::7}."
