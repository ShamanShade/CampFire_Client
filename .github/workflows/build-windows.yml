# Builds the Windows downloads on every push to main, checks they work, and publishes them on the
# repo's Releases page as "Campfire for Windows (latest)". Run it by hand from the Actions tab too.
#   Campfire-Setup.exe   installer for the chat client (Start menu, desktop shortcut, uninstaller)
#   Campfire-Windows.zip all three programs (Campfire.exe, Campfire Admin.exe, Campfire Server.exe)
name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build
        run: pyinstaller --noconfirm campfire.spec

      - name: Check the client has everything (voice, video, emoji, icons...)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/Campfire/Campfire.exe" -ArgumentList "--selftest","selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "Campfire.exe self-test failed" }
          $p = Start-Process -FilePath "dist/Campfire/Campfire Admin.exe" -ArgumentList "--selftest","selftest-admin.txt" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content selftest-admin.txt; throw "Campfire Admin.exe self-test failed" }

      - name: Check the server starts and answers
        shell: pwsh
        run: |
          $s = Start-Process -FilePath "dist/Campfire/Campfire Server.exe" -ArgumentList "--nogui","--port","55990" -PassThru
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 1
            try { $c = New-Object Net.Sockets.TcpClient("127.0.0.1", 55990); $ok = $true; $c.Close(); break } catch {}
          }
          Stop-Process -Id $s.Id -Force
          if (-not $ok) { throw "Campfire Server.exe didn't start listening" }
          Remove-Item -Recurse -Force "dist/Campfire/campfire.db*", "dist/Campfire/campfire_files" -ErrorAction SilentlyContinue

      - name: Zip
        shell: pwsh
        run: |
          Copy-Item README.md dist/Campfire/README.md
          Compress-Archive -Path dist/Campfire -DestinationPath Campfire-Windows.zip

      - name: Build the installer (Campfire-Setup.exe)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DMyAppVersion=1.0.${{ github.run_number }}" installer\campfire.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Check the installer installs, runs and uninstalls
        shell: pwsh
        run: |
          $p = Start-Process "dist\Campfire-Setup.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/TASKS=desktopicon" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Setup failed with exit code $($p.ExitCode)" }
          $app = "$env:LOCALAPPDATA\Programs\Campfire"
          if (-not (Test-Path "$app\Campfire.exe")) { throw "Campfire.exe wasn't installed in $app" }
          if (Test-Path "$app\Campfire Server.exe") { throw "the client installer shouldn't include the server" }
          $s = Start-Process "$app\Campfire.exe" -ArgumentList "--selftest","$env:TEMP\installed-selftest.txt" -Wait -PassThru
          Get-Content "$env:TEMP\installed-selftest.txt"
          if ($s.ExitCode -ne 0) { throw "the installed Campfire failed its self-test" }
          $menu = Join-Path ([Environment]::GetFolderPath("Programs")) "Campfire.lnk"
          $desk = Join-Path ([Environment]::GetFolderPath("Desktop")) "Campfire.lnk"
          if (-not (Test-Path $menu)) { throw "no Start menu shortcut at $menu" }
          if (-not (Test-Path $desk)) { throw "no desktop shortcut at $desk" }
          $u = Start-Process "$app\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          Start-Sleep -Seconds 3
          if ((Test-Path "$app\Campfire.exe") -or (Test-Path $menu)) { throw "uninstall left Campfire behind" }
          Write-Host "Installer OK: installs, runs, makes shortcuts, uninstalls cleanly"

      - uses: actions/upload-artifact@v4
        with:
          name: Campfire-Windows
          path: |
            Campfire-Windows.zip
            dist/Campfire-Setup.exe

      - name: Publish on the Releases page
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest dist/Campfire-Setup.exe Campfire-Windows.zip --target "$GITHUB_SHA" \
            --title "Campfire for Windows (latest)" --latest \
            --notes "**Campfire-Setup.exe** - installs the chat app (Start menu, optional desktop shortcut, uninstall from Windows Settings). No admin rights or Python needed. Running a newer setup file updates Campfire.

          **Campfire-Windows.zip** - all three programs, no install: unzip and double-click **Campfire.exe**, or **Campfire Server.exe** on the PC that hosts the server and **Campfire Admin.exe** to log in on that same PC.

          Version 1.0.${{ github.run_number }}, built automatically from commit ${GITHUB_SHA::7}."
