<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Neon: a glowing cyan and pink ring that pulses -->
  <defs>
    <linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00e5ff"/><stop offset="1" stop-color="#ff2bd6"/></linearGradient>
  </defs>
  <circle cx="60" cy="60" r="53" fill="none" stroke="url(#n)" stroke-width="10" opacity=".25">
    <animate attributeName="opacity" values=".15;.45;.15" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="60" r="53" fill="none" stroke="url(#n)" stroke-width="4"/>
  <circle cx="60" cy="60" r="53" fill="none" stroke="#ffffff" stroke-width="1" opacity=".7"/>
</svg>
